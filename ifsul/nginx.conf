# nginx do container (task "nginx"): o mesmo site de deploy/nginx-nutellaboot3.conf,
# mais os dois ajustes da VM, sem root. TLS termina no HAProxy.
worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Atrás de proxy o $scheme local é sempre "http": sem isto o nginx trocaria
    # por "http" o X-Forwarded-Proto=https que vem do HAProxy.
    map $http_x_forwarded_proto $nb3_fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Sem isto um redirect de diretório vira http://…:8080/, que ninguém serve
    absolute_redirect off;

    upstream nutellaboot3 {
        server 127.0.0.1:8890;
        keepalive 256;
        keepalive_timeout 60s;
    }

    server {
        listen 8080 default_server;
        server_name _;

        client_max_body_size 64m;
        client_body_timeout 120s;
        access_log /dev/stdout combined buffer=64k flush=5s;

        root /opt/nutellaboot3/web;
        index index.html;

        location / { try_files $uri $uri/ $uri/index.html =404; }
        location /docs/ { alias /opt/nutellaboot3/docs/; autoindex on; }
        location /blobs/ { alias /var/lib/nutellaboot3/blobs/; }

        location /api/ {
            include /opt/nutellaboot3/ifsul/nginx-proxy.conf;
            proxy_read_timeout 300s;
        }
        location /boot/ {
            include /opt/nutellaboot3/ifsul/nginx-proxy.conf;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
        }
        location /lock/ {
            include /opt/nutellaboot3/ifsul/nginx-proxy.conf;
            proxy_read_timeout 300s;
        }
        location /healthz {
            include /opt/nutellaboot3/ifsul/nginx-proxy.conf;
            proxy_read_timeout 30s;
            access_log off;
        }
        location ~ ^/api/v1/site-images/[^/]+/events$ {
            include /opt/nutellaboot3/ifsul/nginx-proxy.conf;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }
    }
}
